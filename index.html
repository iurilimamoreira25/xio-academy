<!DOCTYPE html>
<html lang="pt-BR" data-accent="gold">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XIO Academy — Pré-lançamento · 19 de Maio 2026</title>
  <meta name="description" content="XIO Academy — Academia de IA fundada em Parauapebas, Pará. Lançamento oficial em 19 de maio de 2026." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ["'Cormorant Garamond'", 'Georgia', 'serif'],
            sans: ["'Inter Tight'", 'sans-serif'],
            mono: ["'JetBrains Mono'", 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18.3.1 + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>

  <style>
    /* ── CSS Custom Properties ── */
    :root {
      --bg:       #060606;
      --surface:  #0c0c0c;
      --ink:      #F5F4EE;
      --dim:      rgba(245,244,238,0.62);
      --muted:    rgba(245,244,238,0.42);
      --line:     rgba(245,244,238,0.10);
      --line-md:  rgba(245,244,238,0.18);
      --primary:  oklch(0.80 0.065 80);
      --blue:     oklch(0.58 0.18 262);
      --accent:   var(--primary);
    }
    html[data-accent="royal"]  { --accent: var(--blue); }
    html[data-accent="duo"]    { --accent: var(--primary); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter Tight', sans-serif;
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::selection { background: var(--accent); color: #060606; }

    /* ── Typography helpers ── */
    .font-display  { font-family: 'Cormorant Garamond', Georgia, serif; }
    .font-mono     { font-family: 'JetBrains Mono', monospace; }
    .font-sans     { font-family: 'Inter Tight', sans-serif; }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Hairline border util ── */
    .border-line    { border-color: var(--line); }
    .border-line-md { border-color: var(--line-md); }

    /* ── Gold accent text ── */
    .text-accent  { color: var(--accent); }
    .bg-accent    { background: var(--accent); }
    .border-accent{ border-color: var(--accent); }

    /* ── Section rhythm ── */
    .section-pad { padding-top: 7rem; padding-bottom: 7rem; }
    @media (min-width: 768px) {
      .section-pad { padding-top: 10rem; padding-bottom: 10rem; }
    }

    /* ── Marquee ── */
    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .marquee-track { animation: marquee 50s linear infinite; display: flex; white-space: nowrap; }
    .marquee-track:hover { animation-play-state: paused; }

    /* ── Conic spin ── */
    @keyframes conic-spin {
      from { transform: translate(-50%,-50%) rotate(0deg); }
      to   { transform: translate(-50%,-50%) rotate(360deg); }
    }
    .conic-bg {
      position: absolute; left: 50%; top: 50%;
      width: 140vmax; height: 140vmax;
      background: conic-gradient(
        transparent 0deg,
        oklch(0.80 0.065 80 / 0.04) 60deg,
        transparent 120deg,
        oklch(0.80 0.065 80 / 0.03) 200deg,
        transparent 300deg,
        oklch(0.80 0.065 80 / 0.04) 360deg
      );
      animation: conic-spin 60s linear infinite;
      pointer-events: none;
    }

    /* ── FAQ accordion ── */
    .faq-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1);
    }
    .faq-body.open { max-height: 600px; }

    /* ── Video progress ── */
    @keyframes progress-fill {
      from { width: 0; }
      to   { width: 100%; }
    }

    /* ── Form success ── */
    @keyframes xio-success-in {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .xio-success {
      animation: xio-success-in 0.55s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      border: 1px solid var(--accent);
      padding: 2.5rem;
      background: var(--surface);
    }

    /* ── Nav blur ── */
    .nav-scrolled {
      background: rgba(6,6,6,0.85) !important;
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    /* ── Floating CTA ── */
    .floating-cta {
      position: fixed; bottom: 1.5rem; left: 1rem; right: 1rem;
      z-index: 60;
      transform: translateY(120%);
      transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .floating-cta.visible { transform: translateY(0); }

    /* ── Diagonal stripe pattern ── */
    .diagonal-stripe {
      background-image: repeating-linear-gradient(
        45deg,
        rgba(245,244,238,0.03) 0px,
        rgba(245,244,238,0.03) 1px,
        transparent 1px,
        transparent 12px
      );
    }

    /* ── Tweaks panel ── */
    .tweaks-panel {
      position: fixed; bottom: 2rem; right: 2rem;
      z-index: 80;
      background: var(--surface);
      border: 1px solid var(--line-md);
      padding: 1.25rem;
      width: 220px;
      transition: transform 0.3s ease;
    }
    .tweaks-panel.hidden { transform: translateX(calc(100% + 2.5rem)); }

    /* ── Plan card ── */
    .plan-featured {
      border-top: 1px solid var(--accent);
    }

    /* ── Stamp circle text ── */
    @keyframes stamp-rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── Hero Pará highlight ── */
    .hero-para {
      display: block;
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      text-align: center;
      margin-top: 0.15em;
    }

    /* ── Section index separator ── */
    .section-sep { border-top: 1px solid var(--line); }

    /* ── Responsive display heading ── */
    .display-xl {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.02em;
      font-size: clamp(3rem, 9vw, 8.5rem);
    }
    .display-lg {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      line-height: 1.0;
      letter-spacing: -0.02em;
      font-size: clamp(2.25rem, 6vw, 5.5rem);
    }
    .display-md {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.01em;
      font-size: clamp(1.75rem, 4vw, 3.5rem);
    }

    /* ── Pill button ── */
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--ink); color: #060606;
      font-family: 'Inter Tight', sans-serif;
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.85rem 2.25rem;
      border-radius: 100px;
      border: none; cursor: pointer;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
    }
    .btn-primary:hover { background: var(--accent); color: #060606; }

    .btn-outline {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--ink);
      font-family: 'Inter Tight', sans-serif;
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.75rem 1.75rem;
      border-radius: 100px;
      border: 1px solid var(--line-md); cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      text-decoration: none;
    }
    .btn-outline:hover { border-color: var(--ink); }

    .btn-outline-accent {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--accent);
      font-family: 'Inter Tight', sans-serif;
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.75rem 1.75rem;
      border-radius: 100px;
      border: 1px solid var(--accent); cursor: pointer;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
    }
    .btn-outline-accent:hover { background: var(--accent); color: #060606; }

    /* ── Input ── */
    .xio-input {
      width: 100%;
      background: transparent;
      border: 1px solid var(--line-md);
      color: var(--ink);
      font-family: 'Inter Tight', sans-serif;
      font-size: 14px; font-weight: 300;
      padding: 0.85rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .xio-input::placeholder { color: var(--muted); }
    .xio-input:focus { border-color: var(--accent); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-md); border-radius: 2px; }

    /* ── Responsive tweaks ── */
    @media (max-width: 640px) {
      .section-pad { padding-top: 5rem; padding-bottom: 5rem; }
      .display-xl  { font-size: clamp(2.5rem, 11vw, 4.5rem); }
      .display-lg  { font-size: clamp(2rem, 8vw, 3rem); }
      .display-md  { font-size: clamp(1.5rem, 7vw, 2.25rem); }
    }

    @media (max-width: 360px) {
      body { font-size: 14px; }
    }

    /* ── du-accent variations ── */
    html[data-accent="duo"] .plan-featured { border-top-color: var(--primary); }
    html[data-accent="duo"] .plan-featured .price-display { color: var(--primary); }

    /* ═══════════════════════════════════════════════
       XIO · CINEMATIC SCROLL SYSTEM
       taste-skill: MOTION_INTENSITY 6 · Apple-quality
       Hardware: transform + opacity only (no top/left)
    ═══════════════════════════════════════════════ */

    /* Scroll progress bar */
    #xio-bar {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 1px;
      background: transparent; z-index: 200;
      pointer-events: none;
    }
    #xio-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0;
      transition: width 0.06s linear;
    }

    /* ── Hero: word-by-word entrance ── */
    .hw {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.5em);
      transition:
        opacity  0.8s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .hw.in { opacity: 1; transform: none; }

    /* ── Hero: sub-element fade-rise ── */
    .hsr {
      opacity: 0;
      transform: translateY(22px);
      transition:
        opacity  0.9s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .hsr.in { opacity: 1; transform: none; }

    /* ── Scroll reveal: rise + fade ── */
    .sr {
      opacity: 0;
      transform: translateY(44px);
      transition:
        opacity  0.9s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: var(--sd, 0ms);
      will-change: opacity, transform;
    }
    .sr.in { opacity: 1; transform: none; }

    /* ── Scroll reveal: scale + rise (cards) ── */
    .sr-s {
      opacity: 0;
      transform: scale(0.96) translateY(28px);
      transition:
        opacity  0.85s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: var(--sd, 0ms);
      will-change: opacity, transform;
    }
    .sr-s.in { opacity: 1; transform: none; }

    /* ── Scroll reveal: slide from left ── */
    .sr-l {
      opacity: 0;
      transform: translateX(-30px);
      transition:
        opacity  0.75s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: var(--sd, 0ms);
      will-change: opacity, transform;
    }
    .sr-l.in { opacity: 1; transform: none; }

    /* ── Image zoom-out reveal (Apple signature) ── */
    .ir-wrap { overflow: hidden; }
    .ir {
      transform: scale(1.07);
      transition: transform 1.3s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: var(--sd, 0ms);
      will-change: transform;
    }
    .ir-wrap.in .ir { transform: none; }

    /* ── Clip rise (true Apple text reveal) ── */
    .cr-wrap { overflow: hidden; display: block; }
    .cr {
      display: block;
      transform: translateY(110%);
      transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: var(--sd, 0ms);
      will-change: transform;
    }
    .cr-wrap.in .cr { transform: none; }

    /* ── Line draw animation ── */
    .ld {
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: var(--sd, 0ms);
      will-change: transform;
    }
    .ld.in { transform: none; }

    /* ── Directional hover on buttons (taste-skill anti-slop) ── */
    .btn-primary:active, .btn-outline:active, .btn-outline-accent:active {
      transform: scale(0.98);
    }

    /* ── Accessibility ── */
    @media (prefers-reduced-motion: reduce) {
      .hw, .hsr, .sr, .sr-s, .sr-l, .cr, .ir, .ld {
        opacity: 1 !important; transform: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- SECTIONS -->
  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ── LAUNCH TARGET ── */
    const LAUNCH_DATE = new Date('2026-05-19T21:15:00-03:00');

    /* ── COUNTDOWN HOOK ── */
    function useCountdown(target) {
      const calc = () => {
        const diff = target - Date.now();
        if (diff <= 0) return { dias: 0, hrs: 0, min: 0, seg: 0, launched: true };
        const dias = Math.floor(diff / 86400000);
        const hrs  = Math.floor((diff % 86400000) / 3600000);
        const min  = Math.floor((diff % 3600000) / 60000);
        const seg  = Math.floor((diff % 60000) / 1000);
        return { dias, hrs, min, seg, launched: false };
      };
      const [t, setT] = useState(calc);
      useEffect(() => {
        const id = setInterval(() => setT(calc()), 1000);
        return () => clearInterval(id);
      }, []);
      return t;
    }

    /* ── SCROLL HOOK ── */
    function useScrollY() {
      const [y, setY] = useState(0);
      useEffect(() => {
        const h = () => setY(window.scrollY);
        window.addEventListener('scroll', h, { passive: true });
        return () => window.removeEventListener('scroll', h);
      }, []);
      return y;
    }

    /* ── PAD2 ── */
    const p2 = n => String(n).padStart(2, '0');

    /* ─────────────────────────────────────────────
       0. LAUNCH BANNER
    ───────────────────────────────────────────── */
    function LaunchBanner() {
      return (
        <div style={{
          background: 'var(--accent)',
          color: '#060606',
          padding: '0.55rem 1.5rem',
          textAlign: 'center',
          position: 'relative',
          zIndex: 50,
        }}>
          <span className="font-mono" style={{ fontSize: '11px', letterSpacing: '0.18em', textTransform: 'uppercase', fontWeight: 500 }}>
            ● Lançamento oficial · 19 de Maio · 21:15 BRT&nbsp;&nbsp;|&nbsp;&nbsp;Lista aberta · Vagas limitadas
          </span>
        </div>
      );
    }

    /* ─────────────────────────────────────────────
       1. STICKY NAV
    ───────────────────────────────────────────── */
    function Nav({ scrollY }) {
      const scrolled = scrollY > 24;
      return (
        <nav style={{
          position: 'fixed', top: 0, left: 0, right: 0, zIndex: 40,
          padding: '0 1.5rem',
          transition: 'background 0.3s, backdrop-filter 0.3s, border-color 0.3s',
          background: scrolled ? 'rgba(6,6,6,0.85)' : 'transparent',
          backdropFilter: scrolled ? 'blur(16px)' : 'none',
          borderBottom: scrolled ? '1px solid var(--line)' : '1px solid transparent',
        }}>
          <div style={{ maxWidth: 1240, margin: '0 auto', height: 64, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            {/* Logo lockup */}
            <a href="#" style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', textDecoration: 'none' }}>
              <XioMark size={32} />
              <span className="eyebrow" style={{ color: 'var(--dim)', fontSize: '10px' }}>
                XIO / Academy
              </span>
            </a>

            {/* Links (hidden mobile) */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '2.25rem' }} className="nav-links">
              {['Fundadores','Visão','Planos','FAQ'].map(l => (
                <a key={l} href={`#${l.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}`}
                   style={{ textDecoration: 'none', color: 'var(--dim)', fontSize: '13px', fontWeight: 400,
                   transition: 'color 0.2s' }}
                   onMouseEnter={e => e.currentTarget.style.color='var(--ink)'}
                   onMouseLeave={e => e.currentTarget.style.color='var(--dim)'}>
                  {l}
                </a>
              ))}
            </div>

            <a href="#receba" className="btn-outline" style={{ fontSize: '11px', padding: '0.6rem 1.25rem' }}>
              Receber acesso
            </a>
          </div>

          <style>{`
            @media (max-width: 640px) {
              .nav-links { display: none !important; }
            }
          `}</style>
        </nav>
      );
    }

    /* ─────────────────────────────────────────────
       XIO MARK SVG (geometric)
    ───────────────────────────────────────────── */
    function XioMark({ size = 40, opacity = 1 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 40 40" fill="none" style={{ opacity }}>
          {/* X */}
          <line x1="2" y1="4" x2="14" y2="22" stroke="var(--ink)" strokeWidth="1.2" strokeLinecap="round"/>
          <line x1="14" y1="4" x2="2" y2="22" stroke="var(--ink)" strokeWidth="1.2" strokeLinecap="round"/>
          {/* I */}
          <line x1="18" y1="4" x2="18" y2="22" stroke="var(--ink)" strokeWidth="1.2" strokeLinecap="round"/>
          {/* O */}
          <ellipse cx="30" cy="13" rx="7" ry="9" stroke="var(--ink)" strokeWidth="1.2" fill="none"/>
          {/* dot inside O */}
          <circle cx="30" cy="13" r="1.2" fill="var(--accent)"/>
          {/* ACADEMY underline */}
          <text x="1" y="34" fontFamily="'JetBrains Mono', monospace" fontSize="5.5" letterSpacing="0.15em"
                fill="var(--accent)" fontWeight="400">ACADEMY</text>
        </svg>
      );
    }

    /* ─────────────────────────────────────────────
       2. HERO
    ───────────────────────────────────────────── */
    function Hero() {
      const { dias, hrs, min, seg, launched } = useCountdown(LAUNCH_DATE);
      const heroRef = useRef(null);

      useEffect(() => {
        const el = heroRef.current;
        if (!el) return;
        // Word-by-word entrance (Apple style)
        el.querySelectorAll('.hw').forEach(w =>
          setTimeout(() => w.classList.add('in'), parseInt(w.dataset.d || 0))
        );
        // Sub-element staggered fade-rise
        el.querySelectorAll('.hsr').forEach(w =>
          setTimeout(() => w.classList.add('in'), parseInt(w.dataset.d || 0))
        );
      }, []);

      return (
        <section ref={heroRef} id="hero" style={{
          position: 'relative', overflow: 'hidden',
          minHeight: '100vh', display: 'flex', flexDirection: 'column',
          justifyContent: 'center', paddingTop: '8rem', paddingBottom: '0',
        }}>
          {/* Conic background */}
          <div className="conic-bg" />

          {/* Giant XIO watermark */}
          <div style={{
            position: 'absolute', left: '50%', top: '50%',
            transform: 'translate(-50%, -50%)',
            fontFamily: "'Cormorant Garamond', serif",
            fontWeight: 300, fontSize: 'clamp(200px, 40vw, 480px)',
            color: 'var(--ink)', opacity: 0.035,
            letterSpacing: '-0.04em', lineHeight: 1,
            userSelect: 'none', pointerEvents: 'none', zIndex: 0,
            whiteSpace: 'nowrap',
          }}>XIO</div>

          <div style={{ maxWidth: 1240, margin: '0 auto', padding: '0 1.5rem', position: 'relative', zIndex: 2, width: '100%' }}>
            <p className="eyebrow hsr" data-d="80" style={{ marginBottom: '2rem', color: 'var(--muted)' }}>
              Pré-lançamento · Parauapebas, PA
            </p>

            {/* Word-by-word headline — Apple signature reveal */}
            <h1 className="display-xl" style={{ marginBottom: '2.25rem', maxWidth: '18ch' }}>
              {['A','nova','geração','da'].map((w, i) => (
                <span key={w+i} className="hw" data-d={200+i*80}
                  style={{ display:'inline-block', marginRight:'0.28em' }}>{w}</span>
              ))}
              <em style={{ fontStyle:'italic', color:'var(--accent)' }}>
                <span className="hw" data-d="520" style={{ display:'inline-block' }}>tecnologia</span>
              </em>{' '}
              {['começa','no'].map((w, i) => (
                <span key={w} className="hw" data-d={620+i*80}
                  style={{ display:'inline-block', marginRight:'0.28em' }}>{w}</span>

              <span className="eyebrow" style={{ color: 'var(--muted)', fontSize: '10px' }}>
                <span style={{ color: '#22c55e', marginRight: '0.4rem' }}>●</span>
                Todos os sistemas operacionais
              </span>
            </div>
          </div>
        </footer>
      );
    }

    /* ─────────────────────────────────────────────
       12. MOBILE FLOATING CTA
    ───────────────────────────────────────────── */
    function FloatingCTA({ scrollY, visible: externalVisible }) {
      const visible = scrollY > 500 && externalVisible;
      return (
        <div className={`floating-cta ${visible ? 'visible' : ''}`} style={{ display: 'none' }} id="floating-cta">
          <a href="#receba" className="btn-primary" style={{ width: '100%', justifyContent: 'center', borderRadius: '100px', fontSize: '11px', boxShadow: '0 4px 24px rgba(0,0,0,0.6)' }}>
            Receba ebook + vídeo →
          </a>
          <style>{`
            @media (max-width: 640px) {
              #floating-cta { display: block !important; }
            }
          `}</style>
        </div>
      );
    }

    /* ─────────────────────────────────────────────
       TWEAKS PANEL
    ───────────────────────────────────────────── */
    /*EDITMODE-BEGIN*/
    const EDIT_DEFAULTS = {"accent":"gold","floatingCta":true};
    /*EDITMODE-END*/

    function TweaksPanel() {
      const [open, setOpen] = useState(false);
      const [accent, setAccent] = useState('gold');
      const [floatingCta, setFloatingCta] = useState(true);

      const setAccentMode = (v) => {
        setAccent(v);
        document.documentElement.setAttribute('data-accent', v);
      };

      return (
        <>
          {/* Toggle tab */}
          <button
            onClick={() => setOpen(!open)}
            style={{
              position: 'fixed', bottom: '2rem', right: open ? 238 : '2rem',
              zIndex: 81, background: 'var(--surface)', border: '1px solid var(--line-md)',
              color: 'var(--muted)', fontFamily: "'JetBrains Mono', monospace",
              fontSize: '10px', letterSpacing: '0.12em',
              padding: '0.6rem 0.75rem', cursor: 'pointer',
              transition: 'right 0.3s ease',
            }}
          >
            {open ? '×' : 'Edit'}
          </button>

          <div className={`tweaks-panel ${open ? '' : 'hidden'}`}>
            <div className="eyebrow" style={{ color: 'var(--muted)', marginBottom: '1.25rem', fontSize: '10px' }}>
              Painel de edição
            </div>

            {/* Accent color */}
            <div style={{ marginBottom: '1.25rem' }}>
              <div className="eyebrow" style={{ color: 'var(--dim)', fontSize: '9px', marginBottom: '0.6rem' }}>
                Acento principal
              </div>
              <div style={{ display: 'flex', gap: '1px', background: 'var(--line)' }}>
                {[['gold', 'Ouro'], ['royal', 'Royal'], ['duo', 'Duo']].map(([v, label]) => (
                  <button key={v}
                    onClick={() => setAccentMode(v)}
                    style={{
                      flex: 1, padding: '0.5rem 0.25rem', border: 'none', cursor: 'pointer',
                      background: accent === v ? 'var(--accent)' : 'var(--bg)',
                      color: accent === v ? '#060606' : 'var(--muted)',
                      fontFamily: "'JetBrains Mono', monospace", fontSize: '9px', letterSpacing: '0.1em',
                      transition: 'background 0.2s, color 0.2s',
                    }}
                  >{label}</button>
                ))}
              </div>
            </div>

            {/* Floating CTA toggle */}
            <div>
              <div className="eyebrow" style={{ color: 'var(--dim)', fontSize: '9px', marginBottom: '0.6rem' }}>
                CTA flutuante (mobile)
              </div>
              <button
                onClick={() => setFloatingCta(!floatingCta)}
                style={{
                  width: '100%', padding: '0.5rem', border: '1px solid var(--line-md)',
                  background: floatingCta ? 'var(--accent)' : 'var(--bg)',
                  color: floatingCta ? '#060606' : 'var(--muted)',
                  fontFamily: "'JetBrains Mono', monospace", fontSize: '9px',
                  cursor: 'pointer', transition: 'background 0.2s, color 0.2s',
                }}
              >
                {floatingCta ? 'Ativado' : 'Desativado'}
              </button>
            </div>
          </div>
        </>
      );
    }

    /* ─────────────────────────────────────────────
       APP ROOT
    ───────────────────────────────────────────── */
    function App() {
      const scrollY = useScrollY();

      // ── Global animation engine ──
      useEffect(() => {
        const cleanups = [];

        // Scroll progress bar
        const fill = document.getElementById('xio-bar-fill');
        const onScroll = () => {
          const max = document.documentElement.scrollHeight - window.innerHeight;
          if (fill && max > 0) fill.style.width = `${(window.scrollY / max) * 100}%`;
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        cleanups.push(() => window.removeEventListener('scroll', onScroll));

        // Scroll reveal observer — .sr, .sr-s, .sr-l
        const obs1 = new IntersectionObserver(entries => {
          entries.forEach(e => {
            if (e.isIntersecting) { e.target.classList.add('in'); obs1.unobserve(e.target); }
          });
        }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });

        document.querySelectorAll('.sr, .sr-s, .sr-l').forEach(el => obs1.observe(el));
        cleanups.push(() => obs1.disconnect());

        // Image / clip wrap observer — .ir-wrap, .cr-wrap
        const obs2 = new IntersectionObserver(entries => {
          entries.forEach(e => {
            if (e.isIntersecting) { e.target.classList.add('in'); obs2.unobserve(e.target); }
          });
        }, { threshold: 0.12 });

        document.querySelectorAll('.ir-wrap, .cr-wrap').forEach(el => obs2.observe(el));
        cleanups.push(() => obs2.disconnect());

        // Line draw observer — .ld
        const obs3 = new IntersectionObserver(entries => {
          entries.forEach(e => {
            if (e.isIntersecting) { e.target.classList.add('in'); obs3.unobserve(e.target); }
          });
        }, { threshold: 0.2 });

        document.querySelectorAll('.ld').forEach(el => obs3.observe(el));
        cleanups.push(() => obs3.disconnect());

        return () => cleanups.forEach(fn => fn());
      }, []);

      return (
        <div>
          {/* Scroll progress bar — taste-skill MOTION_INTENSITY 6 */}
          <div id="xio-bar"><div id="xio-bar-fill" /></div>
          <LaunchBanner />
          <Nav scrollY={scrollY} />
          <main>
            <Hero />
            <Fundadores />
            <VideoSection />
            <Visao />
            <LeadCapture />
            <Planos />
            <OQueVoceRecebe />
            <Garantia />
            <FAQ />
            <FinalCTA />
          </main>
          <Footer />
          <FloatingCTA scrollY={scrollY} visible={true} />
          <TweaksPanel />
        </div>
      );
    }

    /* Mount */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
